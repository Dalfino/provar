[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provar"
version = "0.1.0"
description = "The assurance layer for hospital AI: black-box red-team probes, postmortem verdicts, and verifiable evidence packs for clinical AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Provar Contributors" }]
keywords = [
  "ai-safety",
  "healthcare",
  "red-team",
  "evaluation",
  "ai-governance",
  "evidence",
  "clinical-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Security",
]
dependencies = ["aiohttp>=3.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
provar = "provar.cli:main"

[tool.setuptools.packages.find]
include = ["provar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
